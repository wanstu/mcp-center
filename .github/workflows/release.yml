name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing Center tag to build
        required: true
        default: v0.1.3
      version:
        description: Release version (must match the tag)
        required: true
        default: v0.1.3
      core_ref:
        description: MCP Center Core tag used by this Center release
        required: true
        default: v0.1.2-rc.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CENTER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      CORE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || 'v0.1.2-rc.1' }}
    steps:
      - name: Checkout MCP Center release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CENTER_REF }}
          path: mcp-center
          fetch-depth: 0

      - name: Checkout MCP Center Core
        uses: actions/checkout@v7.0.1
        with:
          repository: wanstu/mcp-center-core
          ref: ${{ env.CORE_REF }}
          path: mcp-center-core
          fetch-depth: 0

      - name: Verify release tag
        working-directory: mcp-center
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $env:VERSION"
          }
          git fetch --tags --force
          $tagCommit = (git rev-list -n 1 $env:VERSION).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if (-not $tagCommit -or $tagCommit -ne $headCommit) {
            throw "VERSION $env:VERSION does not point to checked out commit $headCommit"
          }

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: mcp-center/go.mod
          cache: true
          cache-dependency-path: |
            mcp-center/go.sum
            mcp-center-core/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Build and verify release
        working-directory: mcp-center
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:VERSION

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mcp-center-${{ env.VERSION }}
          path: mcp-center/dist/${{ env.VERSION }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: mcp-center-${{ env.VERSION }}
          path: release

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Refusing to overwrite published assets."
            exit 1
          fi

          args=(release create "$VERSION" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "MCP Center $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
